<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Management</title>
<style>
:root{
  --black:#0a0c0b; --panel:#121614; --panel2:#181e1b; --line:#2a332e;
  --jade:#00a86b; --jade-dark:#007a4d; --jade-soft:rgba(0,168,107,.14);
  --gold:#d4af37; --gold-soft:#f1d98a; --text:#e9ede9; --muted:#8a968f; --red:#e5484d;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#10201a 0%,var(--black) 55%);color:var(--text);
  font-family:"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
header{text-align:center;padding:26px 0 18px;border-bottom:1px solid var(--gold);margin-bottom:22px;position:relative}
header::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--gold);transform:translateX(-50%) rotate(45deg)}
header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:34px;letter-spacing:3px;
  color:var(--gold);text-transform:uppercase}
header p{margin:6px 0 0;color:var(--jade);letter-spacing:4px;font-size:12px;text-transform:uppercase}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
nav button{background:transparent;color:var(--text);border:1px solid var(--line);padding:10px 22px;border-radius:30px;
  cursor:pointer;font-size:14px;letter-spacing:1px;transition:.2s}
nav button:hover{border-color:var(--jade);color:var(--jade)}
nav button.active{background:linear-gradient(135deg,var(--jade),var(--jade-dark));border-color:var(--jade);color:#fff;
  box-shadow:0 4px 16px rgba(0,168,107,.35)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top:2px solid var(--gold);
  border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
h3{margin:0 0 14px;font-family:Georgia,serif;font-weight:normal;color:var(--gold);letter-spacing:1px;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select{background:#0d110f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;
  outline:none;flex:1;min-width:140px}
input:focus,select:focus{border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
input::placeholder{color:#5f6b64}
button.btn{background:linear-gradient(135deg,var(--jade),var(--jade-dark));color:#fff;border:none;padding:10px 20px;border-radius:8px;
  cursor:pointer;font-size:14px;font-weight:600;letter-spacing:.5px;transition:.2s}
button.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
button.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#1a1500}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
button.ghost:hover{border-color:var(--gold);color:var(--gold)}
button.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
button.danger:hover{background:var(--red);color:#fff}
.small{padding:6px 12px;font-size:12px;margin-right:4px}
.search{margin-bottom:18px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:left;color:var(--gold);font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  padding:12px 10px;border-bottom:1px solid var(--gold);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px}
tr:hover td{background:rgba(0,168,107,.06)}
tr.overdue td{background:rgba(229,72,77,.12)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.ok{background:var(--jade-soft);color:var(--jade);border:1px solid var(--jade)}
.low{background:rgba(212,175,55,.14);color:var(--gold);border:1px solid var(--gold)}
.none{background:rgba(229,72,77,.14);color:var(--red);border:1px solid var(--red)}
.empty{text-align:center;color:var(--muted);padding:22px}
#msg{position:fixed;top:16px;right:16px;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;
  transform:translateY(-10px);transition:.3s;z-index:10;pointer-events:none}
#msg.show{opacity:1;transform:none}
#msg.good{background:var(--jade);color:#fff;border:1px solid var(--gold)}
#msg.bad{background:var(--red);color:#fff}
.page{display:none}.page.active{display:block}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;letter-spacing:2px}
</style>
</head>
<body>
<div id="msg"></div>
<div class="wrap">
  <header>
    <h1>Library</h1>
    <p>Management System</p>
  </header>

  <nav>
    <button id="nav-books" onclick="show('books')">Books</button>
    <button id="nav-students" onclick="show('students')">Students</button>
    <button id="nav-issues" onclick="show('issues')">Issue / Return</button>
  </nav>

  <div id="books" class="page">
    <div class="card search">
      <input id="q" placeholder="Search by title or author..." oninput="loadBooks()">
    </div>
    <div class="card">
      <h3 id="bookFormTitle">Add Book</h3>
      <input type="hidden" id="bid">
      <div class="row">
        <input id="title" placeholder="Title"><input id="author" placeholder="Author">
        <input id="isbn" placeholder="ISBN"><input id="category" placeholder="Category">
        <input id="copies" type="number" min="1" placeholder="Copies" style="max-width:120px">
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" onclick="saveBook()">Save Book</button>
        <button class="btn ghost" onclick="clearBook()">Clear</button>
      </div>
    </div>
    <div class="card">
      <h3>All Books</h3>
      <div class="tablewrap"><table id="booksTable"></table></div>
    </div>
  </div>

  <div id="students" class="page">
    <div class="card">
      <h3>Add Student</h3>
      <div class="row">
        <input id="sname" placeholder="Student name"><input id="semail" placeholder="Email">
        <button class="btn" onclick="addStudent()">Add Student</button>
      </div>
    </div>
    <div class="card">
      <h3>All Students</h3>
      <div class="tablewrap"><table id="studentsTable"></table></div>
    </div>
  </div>

  <div id="issues" class="page">
    <div class="card">
      <h3>Issue a Book</h3>
      <div class="row">
        <select id="ibook"></select><select id="istudent"></select>
        <button class="btn gold" onclick="issueBook()">Issue (14 days)</button>
      </div>
    </div>
    <div class="card">
      <h3>Currently Issued</h3>
      <div class="tablewrap"><table id="issuesTable"></table></div>
    </div>
  </div>

  <footer>LIBRARY MANAGEMENT SYSTEM</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let msgTimer;
function msg(t, err) {
  const m = $('msg'); m.textContent = t; m.className = 'show ' + (err ? 'bad' : 'good');
  clearTimeout(msgTimer); msgTimer = setTimeout(() => m.className = '', 3000);
}
async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json();
  if (!r.ok) { msg(d.error, true); throw new Error(d.error); }
  return d;
}
function show(p) {
  document.querySelectorAll('.page').forEach((e) => e.classList.remove('active'));
  document.querySelectorAll('nav button').forEach((e) => e.classList.remove('active'));
  $(p).classList.add('active'); $('nav-' + p).classList.add('active');
  if (p === 'books') loadBooks();
  if (p === 'students') loadStudents();
  if (p === 'issues') loadIssues();
}

let booksCache = [];
async function loadBooks() {
  booksCache = await api('/api/books?q=' + encodeURIComponent($('q').value));
  $('booksTable').innerHTML = '<tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Available</th><th></th></tr>' +
    (booksCache.length ? booksCache.map((b) => {
      const cls = b.available_copies === 0 ? 'none' : b.available_copies === 1 ? 'low' : 'ok';
      return `<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.isbn)}</td><td>${esc(b.category)}</td>
      <td><span class="badge ${cls}">${b.available_copies} / ${b.total_copies}</span></td>
      <td><button class="btn ghost small" onclick="editBook(${b.id})">Edit</button><button class="btn danger small" onclick="delBook(${b.id})">Delete</button></td></tr>`;
    }).join('') : '<tr><td colspan="6" class="empty">No books yet. Add your first book above.</td></tr>');
}
function clearBook() {
  ['bid', 'title', 'author', 'isbn', 'category', 'copies'].forEach((i) => $(i).value = '');
  $('bookFormTitle').textContent = 'Add Book';
}
async function saveBook() {
  const body = { title: $('title').value, author: $('author').value, isbn: $('isbn').value, category: $('category').value, total_copies: $('copies').value };
  const id = $('bid').value;
  await api(id ? '/api/books/' + id : '/api/books', id ? 'PUT' : 'POST', body);
  msg('Book saved'); clearBook(); loadBooks();
}
function editBook(id) {
  const b = booksCache.find((x) => x.id === id);
  $('bid').value = b.id; $('title').value = b.title; $('author').value = b.author;
  $('isbn').value = b.isbn; $('category').value = b.category; $('copies').value = b.total_copies;
  $('bookFormTitle').textContent = 'Edit Book';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function delBook(id) {
  if (!confirm('Delete this book?')) return;
  await api('/api/books/' + id, 'DELETE'); msg('Book deleted'); loadBooks();
}

async function loadStudents() {
  const s = await api('/api/students');
  $('studentsTable').innerHTML = '<tr><th>ID</th><th>Name</th><th>Email</th></tr>' +
    (s.length ? s.map((x) => `<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td></tr>`).join('')
      : '<tr><td colspan="3" class="empty">No students yet.</td></tr>');
}
async function addStudent() {
  await api('/api/students', 'POST', { name: $('sname').value, email: $('semail').value });
  msg('Student added'); $('sname').value = ''; $('semail').value = ''; loadStudents();
}

async function loadIssues() {
  const [books, students, issues] = await Promise.all([api('/api/books'), api('/api/students'), api('/api/issues')]);
  $('ibook').innerHTML = books.map((b) => `<option value="${b.id}">${esc(b.title)} (${b.available_copies} left)</option>`).join('');
  $('istudent').innerHTML = students.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('issuesTable').innerHTML = '<tr><th>Book</th><th>Student</th><th>Issued</th><th>Due</th><th>Fine</th><th></th></tr>' +
    (issues.length ? issues.map((i) => `<tr class="${i.days_overdue > 0 ? 'overdue' : ''}"><td>${esc(i.title)}</td><td>${esc(i.student)}</td>
    <td>${i.issue_date}</td><td>${i.due_date}</td>
    <td>${i.fine ? '<span class="badge none">₹' + i.fine + ' (' + i.days_overdue + 'd late)</span>' : '-'}</td>
    <td><button class="btn small" onclick="returnBook(${i.id})">Return</button></td></tr>`).join('')
      : '<tr><td colspan="6" class="empty">No books are currently issued.</td></tr>');
}
async function issueBook() {
  await api('/api/issue', 'POST', { book_id: $('ibook').value, student_id: $('istudent').value });
  msg('Book issued'); loadIssues();
}
async function returnBook(id) { await api('/api/return/' + id, 'POST'); msg('Book returned'); loadIssues(); }

show('books');
</script>
</body>
</html>
